apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - http:
        paths:
          # ── Backend routes ─────────────────────────────────────────────────
          # Nginx ingress picks the longest matching prefix, so more-specific
          # paths below always win over the /api catch-all, regardless of order.

          # auth-service handles: /api/v1/auth/*
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001

          # ai-service handles: /api/v1/chat/* and /api/v1/recommendations/*
          - path: /api/v1/chat
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 3002

          - path: /api/v1/recommendations
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 3002

          # core-service handles everything else under /api
          # (products, orders, payments, categories)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 3003

          # ── Frontend SPA ───────────────────────────────────────────────────
          # Nginx inside the frontend container handles react-router paths
          # via try_files, so no rewrite-target is needed here.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
