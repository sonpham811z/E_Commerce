version: "3.9"

services:
  # ─── Backend Services ─────────────────────────────────────────────

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - ./backend/auth-service/.env
    ports:
      - "3001:3001"
    networks:
      - ecommerce-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    env_file:
      - ./backend/ai-service/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      CORE_SERVICE_URL: http://core-service:3003
    ports:
      - "3002:3002"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - ecommerce-network
    restart: unless-stopped

  core-service:
    build:
      context: ./backend/core-service
      dockerfile: Dockerfile
    container_name: core-service
    env_file:
      - ./backend/core-service/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3003:3003"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────────

  frontend:
    build:
      context: ./Ecommerce_Website
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_AUTH_SERVICE_URL: http://localhost:3001
        VITE_AI_SERVICE_URL: http://localhost:3002
        VITE_CORE_SERVICE_URL: http://localhost:3003
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - ai-service
      - core-service
    networks:
      - ecommerce-network
    restart: unless-stopped

# ─── Network ───────────────────────────────────────────────────────

networks:
  ecommerce-network:
    driver: bridge