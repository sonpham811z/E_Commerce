apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-blue
  namespace: ecommerce
  labels:
    app: ai-service
    slot: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
      slot: blue
  template:
    metadata:
      labels:
        app: ai-service
        slot: blue
    spec:
      containers:
      - name: ai-service
        image: haadtechacr2026.azurecr.io/ai-service:blue
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: API_PORT
          value: "8000"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: GROQ_API_KEY
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        - name: CORE_SERVICE_URL
          value: "http://core-service:3003"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1536Mi
        # Python + sentence-transformers + ChromaDB ingestion cần thời gian khởi động lâu hơn
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 30
          failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
