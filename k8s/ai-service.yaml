---
# Service giữ nguyên port 3002 ra ngoài → targetPort 8000 vào container
# Ingress và ConfigMap AI_SERVICE_URL không cần đổi
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: ecommerce
spec:
  selector:
    app: ai-service
    slot: blue
  ports:
  - port: 3002
    targetPort: 8000
  type: ClusterIP
