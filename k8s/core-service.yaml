apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service-blue
  namespace: ecommerce
  labels:
    app: core-service
    slot: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
      slot: blue
  template:
    metadata:
      labels:
        app: core-service
        slot: blue
    spec:
      containers:
      - name: core-service
        image: haadtechacr2026.azurecr.io/core-service:blue
        ports:
        - containerPort: 3003
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: PORT
          value: "3003"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: DATABASE_URL
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: STRIPE_SECRET_KEY
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service-green
  namespace: ecommerce
  labels:
    app: core-service
    slot: green
spec:
