      - name: core-service
        image: haadtechacr2026.azurecr.io/core-service:green
        ports:
        - containerPort: 3003
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: PORT
          value: "3003"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: DATABASE_URL
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: STRIPE_SECRET_KEY
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        resources:
          requests:
